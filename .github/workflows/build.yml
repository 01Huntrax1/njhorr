name: Build VST3
on: [workflow_dispatch, push]

# a newer push makes the build of the older one pointless
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE
        run: |
          git init JUCE
          git -C JUCE fetch --depth 1 https://github.com/juce-framework/JUCE.git 454fe891acc8204f99f4ef1e3a28c84b1a4da145
          git -C JUCE checkout FETCH_HEAD
      - name: Pick the MSVC toolset (14.52 made the link of the generated DSP run for hours; 14.51 builds it in about 15 minutes)
        shell: pwsh
        run: |
          $dirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC" -Directory | ForEach-Object { $_.Name }
          Write-Host "Installed MSVC toolsets: $dirs"
          $t = $dirs | Where-Object { $_ -like '14.51*' } | Select-Object -First 1
          if (-not $t) { $t = $dirs | Select-Object -First 1 }
          Write-Host "Using toolset $t"
          "NJO_TOOLSET=$t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ env.NJO_TOOLSET }}
      # compiled objects are cached between runs: the generated DSP (the slow part, about 15 minutes) and JUCE only rebuild when they changed
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DJUCE_PATH=${{ github.workspace }}/JUCE
      - name: Build
        run: cmake --build build --parallel
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: Njohrr-VST3-${{ runner.os }}
          path: build/Njohrr_artefacts/Release/VST3/
      - uses: actions/upload-artifact@v4
        with:
          name: NjohrrFX-VST3-${{ runner.os }}
          path: build/NjohrrFX_artefacts/Release/VST3/
